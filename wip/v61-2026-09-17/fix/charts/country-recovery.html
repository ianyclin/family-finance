<!doctype html><meta charset="utf-8"><style>:root{--teal:#176c5a;--accent:#a4483f;--fill:#eef2ef;--sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--paper:#f6f2e9;--surface:#fffdf8;--ink:#17211d;--muted:#5d6a64;--line:#d8d4ca;--green:#176c5a;--green2:#dceee7;--amber:#b66d18;--amber2:#f6e7cf;--red:#a4483f;--blue:#345f88;--shadow:0 12px 32px rgba(23,33,29,.08);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

figure.chart .chart-sub{font-size:.84rem;line-height:1.5;color:var(--muted)}
figure.chart .chart-body{margin:0 -4px}
figure.chart svg{display:block;width:100%;height:auto}
figure.chart svg.m{display:none}figure.chart svg.d.m{display:block}
figure.chart .legend{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none;margin:10px 0 0;padding:0;font-size:.84rem;line-height:1.6;color:var(--ink)}
figure.chart .legend .swatch{display:inline-block;width:1.1em;height:.6em;border-radius:3px;margin-right:.45em;vertical-align:baseline}
figure.chart .note{margin:8px 0 0;font-size:.84rem;line-height:1.6;color:var(--muted)}

figure.chart table.dca{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;margin-top:10px;font-size:.84rem}

figure.chart table.dca th{color:var(--muted);font-weight:500}
figure.chart table.dca thead th{color:var(--ink);font-weight:700}
figure.chart table.dca tbody th{text-align:left}

<p class="note">三條都是價格指數（不含股利）、名目、各自幣別，沒有扣物價、費用和稅。美國：道瓊工業指數，聯準會歷史頁；日本：日經 225 指數，日經官方；台灣：加權股價指數，證交所逐日收盤。日期都是收盤日。長條畫到第一次收盤超過舊高點；之後還是可能再跌回舊高點以下。含息版會比較早回到高點：日本含息版 2021 年就先過了高點（價格版是 2024 年）；美國、台灣本文沒有含息版的日期。三個指數、幣別不同，不能直接比快慢。</p><figcaption>每一條是一個市場的價格指數，從當時最高的收盤，到第一次收盤超過它為止：美國約 25 年、日本 34 年 2 個月、台灣約 30 年。這是三個挑出來的例子，不是每次下跌都這麼久，也不代表下跌一定回得來。</figcaption>
