<ul class="legend"><li><span class="swatch" style="background:var(--accent)"></span>1990 年初放股票八成、現金兩成，之後都不動：每年年底的股票占比（防守用美國 3 個月國庫券代表定存，不跌價、利息低）</li><li><span class="swatch" style="background:var(--ink)"></span>虛線：設定的 80%（再平衡就是調回這裡）</li><li><span class="swatch" style="background:var(--amber)"></span>淡色帶：5/25 門檻 75% 到 85%</li></ul><p class="note">美國 S&amp;P 500（含息）與美國 3 個月國庫券的年度報酬，出自 Damodaran（紐約大學 Stern）公開資料集；名目、以美元計，沒有扣物價、費用和稅，也沒有投入新錢或提領。防守用美國 3 個月國庫券代表定存（不跌價、利息低）。1990 年初放股票 80%、現金 20%，之後不買不賣，每年年底看一次股票占多少。圖只看得到每年年底；兩個年底之間可能早就跑出門檻，或跑得更遠，這裡看不出來。門檻照 5/25 算：股票 80% 的四分之一是 20 個百分點，比 5 大，取 5；現金 20% 的四分之一剛好是 5，所以兩邊都是股票 75% 到 85%。示意：只用美國一個市場、一個起點。防守換成美國 10 年期公債（資料集用 10 年期殖利率換算的報酬，不是債券基金的實際報酬）的話，2002、2008 年公債上漲，股票占比會落回門檻裡（2008 年底 78.3%）。換一個起點，跑掉的方向和快慢都不一樣：2000 年初開始的話，先往下跑，2001 年底就掉到 74.5%；1928 到 2021 年每一年都當一次起點算過，94 個起點裡，第一次超出門檻最快 1 年；一半以上 4 年內就跑出門檻，超過九成在 10 年內。過去的走法不代表以後會一樣。</p><figcaption>1990 年初放股票八成、現金兩成，之後都不動：第 6 年（1995 年底）股票占比第一次超過 85%，之後到 2025 年底沒有一年回到門檻裡，2008 年底是 87.7%，2025 年底變成 98.3%；往哪邊跑、多快跑出去，換個起點就不一樣（圖下說明有 2000 年起點先往下跑的例子）。中間虛線是設定的八成；線跑出淡色帶，就是 5/25 說該動手的時候。</figcaption>
