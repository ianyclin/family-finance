<ul class="legend"><li><span class="swatch" style="background:var(--teal)"></span>一條自己畫的價格線：先漲一段、急漲、崩下來、反彈、盤整、再漲</li><li><span class="swatch" style="background:var(--amber)"></span>沿線十一站：很多人走過的順序</li><li><span class="swatch" style="background:var(--muted)"></span>橫的虛線是第一次買進的價格</li></ul><p class="note">圖上沒有任何數字：這條線是自己畫的，不是任何市場、任何一檔股票的資料，沒有刻度、沒有幣別、也沒有年份；橫的虛線只是用來標出「第一次買進的價格」，好讓跌回去那一站看得出來和買進時是同一個高度；第 8 站再買一張以後，平均成本比第一次買進的價格低，所以第 10 站落在虛線下面。形狀借自流傳很廣的「投資人情緒循環」示意（最早的版本常標 Westcore Funds，1998）；本文沒有轉載任何一版，這條線和每一站的字都是本文自己畫、自己寫的。每一站旁邊的節號，是這本書處理那一步的地方：第 <a class="xref" href="#s2">2</a> 節現在開始會不會太晚（前幾年帳戶裡多半是自己存進去的錢，越往後自己長出來的部分越多）；第 <a class="xref" href="#s6">6</a> 節要不要等跌下來再買（猜低點要猜對兩次，等待也有代價）；第 <a class="xref" href="#s8">8</a> 節漲了要不要先賣一些（賣掉以後，那筆錢就不再跟著漲跌；如果之後還想買回來，就要再猜一次什麼時候買）；第 <a class="xref" href="#s10">10</a> 節明明知道，為什麼還是想動手（捨不得認賠：買進的價格是過去的事；還有冷卻期）；第 <a class="xref" href="#s11">11</a> 節把答案寫成一張紙：我的投資計畫（F 區先寫好跌多少各做什麼、什麼情況才賣，再加一次大跌演練）。</p><figcaption>這條線是很多人走過的順序：漲一段、急漲、崩下來、反彈、盤整、再漲；每一站旁邊寫的是這本書哪一節擋它。線的高度是畫出來的，不是任何市場的資料，也不是說接下來會照這個順序走。</figcaption>
