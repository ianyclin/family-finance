<p class="note">含息、名目，起點那個月當 1 倍；沒有扣物價、費用和稅，也不是台幣。</p><details class="more" data-print="open"><summary>想深入：這張圖的資料、期間和沒算進去的東西</summary><p class="note">S&amp;P 500 含息：1929 年 1 月到 2023 年 6 月用 Robert Shiller 公開月資料（月報酬＝當月價格加上當月股利的十二分之一，再除以上個月的價格），2023 年 7 月起用 S&amp;P 500 總報酬指數的月報酬串接到 2026 年 8 月，共 1172 個月。串接是因為 Shiller 那份資料的股利欄到 2023 年 6 月為止。兩邊的價格口徑不完全一樣：Shiller 用當月每日收盤的平均，總報酬指數用月底收盤。圖上只標事件的名稱和年月，每一件的日期出處寫在本節來源卡。</p></details><figcaption>1929 年初投進去的 1 元，含息到 2026 年變成大約 9,899 元；中間最深的一次，帳面少掉 82%。每一件在當時都像世界末日；拉長看，是線上的一個凹陷。這是歷史，不是保證：下一次不一定回得來得這麼快，也可能像第 <a class="xref" href="#s4">7</a> 節那三個例子一樣等很久。縱軸同樣是對數刻度；美股只有月資料，事件點標在該月。</figcaption>
