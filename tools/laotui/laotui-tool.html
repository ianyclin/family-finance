<p class="proto">這是《隔離人性》第 24 節「要不要自提」的試算工具；數字怎麼算、來源在哪，見頁尾。</p>
<figure class="chart" id="fig">
<div class="pad">
<p class="chart-title">要不要自提：自提比自己投指數多拿或少拿幾成</p>
<p class="chart-sub">60 歲那天一次領，兩條路各剩多少稅後的錢</p>
<div class="ctl" id="ctl">
<div class="grp" role="group" aria-label="勞退報酬"><span class="gl">勞退報酬</span><button type="button" data-k="rl" data-v="0.017">1.7%（115 年 10 月保證收益率）</button><button type="button" data-k="rl" data-v="0.021">2.1% 最差十年</button><button type="button" data-k="rl" data-v="0.0465">4.65% 2006–2025</button></div>
<div class="grp" role="group" aria-label="自己投的報酬"><span class="gl">自己投的報酬</span><button type="button" data-k="gi" data-v="0.06">6%</button><button type="button" data-k="gi" data-v="0.075">7.5%</button><button type="button" data-k="gi" data-v="0.09">9%</button></div>
</div>
<p class="read">每個數字＝自提那條路 60 歲一次領、繳完稅剩下的錢 ÷ 不自提、把稅後的錢自己投的那條路 − 1。<b>正的是自提多拿，負的是自提少拿。</b></p>
</div>

<p class="sec pad">一眼看全部<span>綠＝自提贏，琥珀＝自提輸；越深差越多；最右欄是自提第幾年起轉輸</span></p>
<div class="box" id="heat"></div>


<figcaption class="pad">
<p id="now"></p>
<p>固定假設：每月提繳＝薪水的 6%（自提上限），薪水用各級距常見的水準、雇主同額、25 歲開始工作 60 歲一次領（年資 35 年）、退休那年沒有薪水、自己投台股 ETF 並繳配息稅；每一條為什麼這樣定，見「怎麼算」。</p>
<p>圖上已經把 60 歲一次領要補的稅算進去；誰要補、會差多少，見下面「補繳的稅差多少」。</p>
</figcaption>

<details class="tv pad" id="gapd"><summary>補繳的稅差多少</summary>
<p>要補繳的只有同時符合這幾點的人：60 歲一次領、年資長、月薪到上限所以雇主也提到頂、帳戶總額超過免稅額。年資 35 年時，一次領 <span data-g="ex1"></span> 萬以內免稅，<span data-g="ex1"></span> 萬到 <span data-g="ex2"></span> 萬之間一半計入所得，超過的全數計入（115 年度數字）。年資滿 15 年改按月領，每年 89.4 萬以內免稅，多數人零稅。</p>
<p>圖上已經把補繳算進去，而且假設免稅額和級距每年隨物價調 1.5%。下面這張圖是：熱圖每一格的數字，往上最多再加多少（完全不用補的人），往下最多再減多少（免稅額和級距一直不調）。5% 級距是零；12% 級距最多差 <span data-g="b12"></span> 個百分點；20% 以上的人，不用補最多再加 <span data-g="X"></span> 個百分點，免稅額和級距若都不調，存越久差越多，最多再減 <span data-g="Y"></span> 個百分點。</p>
<div class="box" id="band"></div>
<p id="flipnote"></p>
<p class="small">以上百分點是目前設定的數字；九種報酬組合裡差最多的是 <span data-g="M"></span> 個百分點（<span data-g="Mside"></span>，勞退 <span data-g="Mrl"></span>、自己投 <span data-g="Mgi"></span>，<span data-g="Mk"></span>% 級距、自提 <span data-g="Mn"></span> 年）。</p>
</details>
<details class="tv pad"><summary>怎麼算</summary>
<h4>兩條路</h4>
<p><b>自提：</b>每月從薪水撥一筆進勞退個人專戶。這筆錢不算當年的所得，所以一毛都不用先繳所得稅，整筆用勞退基金的報酬滾到 60 歲。</p>
<p><b>不自提、自己投：</b>同樣的錢留在薪水裡，先被扣所得稅（你現在的級距），剩下的才每月月底投進台股 ETF，60 歲那天全部賣掉。</p>
<h4>兩個開關各改什麼</h4>
<ul>
<li><b>勞退報酬：</b>自提那份和雇主那份每年的報酬。三個數字都來自勞動基金運用局表 2（連結在下方來源）：4.65%＝新制勞退基金 2006–2025 年化；2.1%＝2006–2015 年化 2.12%，是最差的十年；1.7%＝115 年 10 月的保證收益率（1.7108%）。法定保證是浮動的二年期定存利率，2006–2025 平均約 1.4%。</li>
<li><b>自己投的報酬：</b>不自提那條路扣稅前的年報酬，其中 3% 是配息。配息稅照你的級距扣：合併計稅可抵減 8.5%，抵減超過應繳稅額的部分會退稅（所得稅法第 100 條），所以級距 5% 反而小賺；級距 40% 改用 28% 分開計稅。再扣二代健保補充保費 2.11%。賣出沒有所得稅，只有 0.1% 證交稅（圖裡沒算，約 0.1 個百分點）。</li>
</ul>
<h4>稅怎麼算（固定做法）</h4>
<p>60 歲一次領，自提的錢、雇主提撥的錢（含各自的收益）合成一筆「退職所得」來算稅。每一年年資有一段免稅額：206,000 元以內不算所得；206,000 到 414,000 元的部分一半算所得；超過 414,000 元的部分全部算所得。年資幾年，這兩條線就乘幾（這裡固定 35 年）。算出來的所得扣掉退休那年的免稅額與標準扣除額（合計 23.7 萬），再照 115 年度的綜所稅累進稅率算稅（0–61 萬 5%、61–138 萬 12%、138–277 萬 20%、277–519 萬 30%、以上 40%）。雇主那份和自提那份<b>共用同一段免稅額</b>，雇主那份滾滿 35 年，比自提長，先把免稅額用掉一部分，所以自提那份要負擔的稅＝（含自提的稅）−（只有雇主那份的稅）。</p>
<p>免稅額和級距隨物價調：自提 n 年後，免稅額（206,000／414,000）和稅率級距的上下限、累進差額都乘 1.015 的 n 次方。法條是物價累計漲滿 3% 才調一次，這裡用每年連續調整來近似。</p>
<h4>固定假設，和為什麼這樣定</h4>
<ul>
<li><b>每月提繳＝薪水的 6%（自提上限），薪水用各級距常見的水準：</b>5% 級距月薪 45,000（每月提 2,700）、12% 級距 100,000（6,000）、20%、30%、40% 級距 150,000（9,000）。115 年度（單身、只有薪資、標準扣除）各級距的月薪範圍約是：5% 級距 3.9–9 萬、12% 級距 9–15.4 萬、20% 以上 15.4 萬起；這裡取 4.5 萬、10 萬為代表，20% 以上超過勞退提繳工資上限 15 萬，一律以 15 萬提繳。級距低的人薪水低、提得少，一次領多半落在免稅額內。12% 級距的月薪約 <span data-g="s12"></span> 萬起，翻盤年提早到第 <span data-g="s12a"></span>–<span data-g="s12b"></span> 年（帳戶總額大、免稅額吃得多）。</li>
<li><b>雇主同額：</b>雇主每月也提薪水的 6%，和自提同額，用同樣的報酬滾。多數受僱者的雇主就是提 6%。自營者沒有雇主那份，免稅額被吃得少，結果會比圖上好。</li>
<li><b>25 歲開始工作、60 歲一次領，年資 35 年：</b>年資決定免稅額（每一年年資 20.6 萬），這裡用一般人的職涯長度。橫軸是自提幾年，也就是離 60 歲還有幾年；在那之前的年資都只有雇主在提。雇主那份滾滿 35 年，自提那份只滾自提的年數。30 歲後才就業、或中途離開職場多年的人，雇主那份被高估、自提的好處被低估。</li>
<li><b>退休那年沒有薪水：</b>多數人領的那年已經沒有薪水，其他所得當作 0，退職所得從 5% 開始往上累進。還在工作就領的人，稅會比圖上多。已扣退休那年的免稅額與標準扣除額（合計 23.7 萬，115 年度）；薪資特別扣除額退休那年沒薪水用不到。</li>
<li><b>台股 ETF 配息課稅：</b>台灣掛牌的指數 ETF 都配息，配息照級距繳稅（殖利率 3%）。用不配息的 ETF 的人，結果會比圖上好一點。</li>
<li><b>60 歲一次領：</b>兩條路要在同一天變成稅後的錢才能比。改按月領多半是零稅，但錢留在基金裡，用的是基金的報酬。</li>
</ul>
<h4>沒算進去的</h4>
<ul class="small">
<li>隨物價調整的 3% 門檻（用連續調整近似）、賣出的 0.1% 證交稅、勞退基金每年報酬高低起伏與保證收益的補足。</li>
<li>股利單次未達 2 萬元不扣補充保費，圖裡一律扣了，自己投那條路最多被低估約 1.5 個百分點。</li>
<li>股利 8.5% 抵減每戶 8 萬上限，這裡的金額碰不到。</li>
</ul>
<h4>數字從哪裡來</h4>
<ul class="small">
<li><a href="https://www.bli.gov.tw/0108501.html">勞動部勞工保險局：個人自願提繳退休金</a></li>
<li><a href="https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=N0030020&amp;flno=14">勞工退休金條例第 14 條（雇主提撥與個人自願提繳）</a></li>

<li><a href="https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=34b463dc8f1b49f29d440d92a6fd5139">財政部：115 年度綜合所得稅課稅級距與累進差額、退職所得定額免稅金額公告</a></li>
<li><a href="https://www.blf.gov.tw/media/ch3lc5dv/2-%E6%96%B0%E5%88%B6%E5%8B%9E%E5%B7%A5%E9%80%80%E4%BC%91%E5%9F%BA%E9%87%91%E7%B6%93%E7%87%9F%E6%A6%82%E6%B3%81.pdf">勞動部勞動基金運用局：新制勞工退休基金經營概況（表 2 歷年收益率）</a></li>
</ul>
<p class="small">參數：勞退報酬 4.65%＝新制勞退基金 2006–2025 年化（可切 2.1%＝2006–2015 最差的十年、1.7%＝115 年 10 月保證收益率）；自己投的報酬是扣配息稅前的年化報酬（可切 6%、7.5%、9%），其中台股 ETF 殖利率 3%，配息稅與補充保費 2.11% 已在圖裡扣掉；一次領的免稅額以 115 年度為準：免稅線 206,000 元、半數課稅到 414,000 元（每年資）。</p>
</details>
<details class="tv" id="yby"><summary class="pad">逐年細看：折線與表格</summary>
<p class="sec pad">隨年數怎麼變<span>線尾數字是現在的所得稅級距；圓點是翻盤的那一年</span></p>
<div class="box" id="line"></div>

function show(html,ev,el){tip.innerHTML=html;tip.style.display='block';var r=el.getBoundingClientRect(),x,y;
  if(ev&&ev.clientX!=null&&ev.type!=='focus'){x=ev.clientX;y=ev.clientY;}else{x=r.left+r.width/2;y=r.top;}
  var tw=tip.offsetWidth,th=tip.offsetHeight,L=Math.min(Math.max(8,x+12),window.innerWidth-tw-8),Tp=y-th-12;if(Tp<8)Tp=y+16;tip.style.left=L+'px';tip.style.top=Tp+'px';}
function hide(){tip.style.display='none';}
/* ---------- 補繳的稅差多少：M 系列固定掃九組；X、Y、b12 在 render() 跟著目前設定 ---------- */
function gaps(s){var bn=[0,0,0],bf=[0,0,0];KS.forEach(function(k){for(var n=1;n<=35;n++){var i=cell(s,k,n).v,a=cell(s,k,n,'none').v-i,b=i-cell(s,k,n,'frozen').v;
  if(a>bn[0]+1e-12)bn=[a,k,n];if(b>bf[0]+1e-12)bf=[b,k,n];}});return {n:bn,f:bf};}
function setG(V){document.querySelectorAll('[data-g]').forEach(function(e){if(Object.prototype.hasOwnProperty.call(V,e.dataset.g))e.textContent=V[e.dataset.g];});}
function fillGaps(){var M=[0],RN={0.017:'1.7%',0.021:'2.1%',0.0465:'4.65%'},GN={0.06:'6%',0.075:'7.5%',0.09:'9%'};
  [0.017,0.021,0.0465].forEach(function(rl){[0.06,0.075,0.09].forEach(function(gi){var g=gaps({rl:rl,gi:gi});
    if(g.n[1]&&g.n[0]>M[0])M=[g.n[0],'完全不用補',rl,gi,g.n[1],g.n[2]];if(g.f[1]&&g.f[0]>M[0])M=[g.f[0],'免稅額和級距不調',rl,gi,g.f[1],g.f[2]];});});
  var pp=function(x){return (x*100).toFixed(1);},V={ex1:(206000*CAREER/1e4).toLocaleString('en-US'),ex2:(414000*CAREER/1e4).toLocaleString('en-US'),
    M:pp(M[0]),Mside:M[1],Mrl:RN[M[2]],Mgi:GN[M[3]],Mk:M[4],Mn:M[5]};
  var base=flip(grid1(12,6000)),first=0,lo=99,hi=0;for(var sal=100000;sal<=153000;sal+=1000){var f=flip(grid1(12,Math.min(sal,150000)*0.06));if(!first&&f&&f<base)first=sal;if(first&&f){lo=Math.min(lo,f);hi=Math.max(hi,f);}}
  V.s12=Math.round(first/1e4);V.s12a=lo;V.s12b=hi;
  setG(V);return V;}
/* 12% 級距用指定的每月提繳重算一列（預設報酬） */
function grid1(k,p){var keep=PK[k],o=[];PK[k]=p;for(var n=1;n<=35;n++)o.push(cell({rl:0.0465,gi:0.075},k,n));PK[k]=keep;return o;}
/* ---------- render ---------- */
var G;
function render(){
  G=grid(S);
  document.getElementById('heat').innerHTML=heatSVG(G,'d')+heatSVG(G,'m');
  var ld=lineSVG(G,'d'),lm=lineSVG(G,'m');document.getElementById('line').innerHTML=ld.html+lm.html;
  document.getElementById('tbl').innerHTML=tableHTML(G);
  var D=bandData(S),mx=function(arr){return Math.max.apply(null,arr.concat([0]));};
  document.getElementById('band').innerHTML=bandSVG(D,'d')+bandSVG(D,'m');
  document.getElementById('flipnote').textContent=flipNote(S);
  setG({X:pp1(Math.max(mx(D[20].a),mx(D[30].a),mx(D[40].a))),Y:pp1(Math.max(mx(D[20].b),mx(D[30].b),mx(D[40].b))),b12:pp1(mx(D[12].b))});
  document.querySelectorAll('#band svg').forEach(function(svg){var guide=svg.querySelector('.guide');
    function off(){guide.setAttribute('visibility','hidden');hide();}
    svg.querySelectorAll('.hit').forEach(function(h){function on(ev){var n=+h.dataset.n,x=+h.dataset.x;guide.setAttribute('x1',x);guide.setAttribute('x2',x);guide.setAttribute('visibility','visible');
      var lines=['<b>自提 '+n+' 年</b>'];BK.forEach(function(k){lines.push('級距 '+k+'%　不用補 +'+pp1(D[k].a[n-1])+'／不調 '+(pp1(D[k].b[n-1])==='0.0'?'':MINUS)+pp1(D[k].b[n-1]));});
      show(lines.join('\n'),ev,h);}
      h.addEventListener('pointerenter',on);h.addEventListener('pointermove',on);h.addEventListener('focus',on);h.addEventListener('blur',off);});
    svg.addEventListener('pointerleave',off);});
  document.getElementById('now').textContent='目前設定：'+LBL.rl[S.rl]+'；'+LBL.gi[S.gi]+'。';
  document.querySelectorAll('#ctl button').forEach(function(b){b.setAttribute('aria-pressed',String(S[b.dataset.k])===b.dataset.v?'true':'false');});
  document.querySelectorAll('#heat .cell').forEach(function(c){
    function on(ev){var k=+c.dataset.k,n=+c.dataset.n,x=G[k][n-1];
      show('<b>級距 '+k+'%，自提 '+n+' 年（年資 '+x.Y+' 年），60 歲一次領</b>\n自提：'+yen(x.A-x.tx)+' 元（已扣因為自提多繳的稅 '+yen(x.tx)+' 元）\n不自提、自己投：'+yen(x.B)+' 元\n自提'+(x.v>=0?'多拿 ':'少拿 ')+Math.abs(x.v*100).toFixed(1)+'%',ev,c);}
    c.addEventListener('pointerenter',on);c.addEventListener('pointermove',on);c.addEventListener('focus',on);c.addEventListener('pointerleave',hide);c.addEventListener('blur',hide);});
  [[document.querySelector('#line svg.d'),ld.Y],[document.querySelector('#line svg.m'),lm.Y]].forEach(function(pr){var svg=pr[0],Y=pr[1],guide=svg.querySelector('.guide'),hl=svg.querySelector('.hl');
    function off(){guide.setAttribute('visibility','hidden');hl.innerHTML='';hide();}
    svg.querySelectorAll('.hit').forEach(function(h){function on(ev){var n=+h.dataset.n,x=+h.dataset.x;guide.setAttribute('x1',x);guide.setAttribute('x2',x);guide.setAttribute('visibility','visible');hl.innerHTML='';
      var lines=['<b>自提 '+n+' 年（年資 '+CAREER+' 年），60 歲一次領</b>'];for(var i=KS.length-1;i>=0;i--){var v=G[KS[i]][n-1].v,cc=document.createElementNS(NS,'circle');cc.setAttribute('cx',x);cc.setAttribute('cy',Y(v));cc.setAttribute('r',4);cc.setAttribute('class','c'+i);hl.appendChild(cc);lines.push('級距 '+KS[i]+'%　'+pct(v,1));}
      show(lines.join('\n'),ev,h);}
      h.addEventListener('pointerenter',on);h.addEventListener('pointermove',on);h.addEventListener('focus',on);h.addEventListener('blur',off);});
    svg.addEventListener('pointerleave',off);});}
document.querySelectorAll('#ctl button').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.k,v=b.dataset.v;S[k]=+v;hide();render();});});
fillGaps();
render();
if(/[?&]open=band(&|$)/.test(location.search))document.getElementById('gapd').open=true;/* 只給截圖用 */
})();
</script>
</body>
</html>
