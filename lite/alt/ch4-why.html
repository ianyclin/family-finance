<p><strong>先分清楚是哪一種跌。</strong>波動是價格上上下下，你買的公司大多還在營業；永久損失是東西真的沒了，例如公司倒閉、遇到詐騙。波動會在兩種情況變成真的傷害：第一，錢很快要用，被迫低價賣；第二，比例超過心理承受度，自己在低點賣。</p>
<ul class="checklist">
<li><strong>跌和漲不對稱：</strong>100 萬跌 50%，剩 50 萬；要回到 100 萬，得漲 100%。</li>
<li><strong>債券通常能降低波動，但不保證：</strong>2022 年美國股票 −18.1%、投資等級債 −13.0%，同一年下跌。</li>
</ul>
