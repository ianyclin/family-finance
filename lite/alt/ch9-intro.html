<p>第八章的小安股票放八成。這一章再看三個人：收入不固定的阿凱、七年後要買房的小芸與阿哲、五年後退休的陳大哥。四個人都照同一套步驟定股債比：先寫下這筆錢哪一年要用、要多少；照低情境試算夠不夠；算大跌那天實際少多少錢，回答三問；不夠時照「多存 → 延後 → 降低目標」的順序補，不靠調高股票比例。</p>
