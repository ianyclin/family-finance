<p><strong>預備金以外，手上已經有一筆錢：</strong>把過去的歷史切成很多段來比，一次投入和分三個月投入相比，約 68% 的段落是一次投入比較好。分批降低的是「剛投入就大跌」的後悔，不會提高平均報酬。如果你知道自己一次全進、遇到大跌就會忍不住賣掉，分批比較適合你。</p>
