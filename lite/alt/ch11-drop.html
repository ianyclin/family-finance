<p>第四章的大跌演練，是在平靜的晚上先寫好：目標那一年股票跌 50% 時少多少萬、你真的會想做什麼、F 區寫的是什麼。寫上日期，把數字念給家人聽一次。</p><ul class="checklist"><li>真的遇到第一次下跌時，把演練那張紙拿出來比一比。</li><li>把當下想做的動作寫下來，不動手。</li><li>基金公布的報酬，是「一開始放進去就不動」的人拿到的成績。熱門時加碼、下跌時退出，會讓投資人的錢放在較差的時段。</li></ul>
