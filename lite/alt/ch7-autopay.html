<p><strong>定期定額扣款失敗，不是違約交割。</strong>定期定額扣款時餘額不夠，當期就不買，不算違約交割；連續幾次失敗可能被暫停或終止、要重新申請，規定看各家券商。自己下單買進、已經成交，到成交後第二個營業日交割時錢還不夠，才是違約交割。</p>
