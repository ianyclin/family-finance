<h3>朋友集中一檔賺很多：他也幫你打工</h3><p>眼前看到的是短暫片段，不是完整二十年。假設他重押的是台積電：2026 年 8 月底，全球市值型指數裡台積電大約占百分之一點七，你每投 1 萬元，大約 170 元本來就在它身上。他賺錢的那家公司，也有一小塊在幫你打工；只是你同時請了幾千家公司一起打工，不用猜明年哪一家最好。</p><p class="small">台積電占多少，每個月都會變。這不代表集中一定比較差。只是那一檔跌的時候，你只有一小塊跟著跌。</p>
