<p class="small">正式說法：台灣集中市場普通交易採 T+2 交割，T 是成交日，第二個營業日完成款券交割。假日不算營業日。違約時券商會先代你完成交割，再處分股票；違約紀錄也會轉知所有券商（規定見完整版〈第一次投資的七個步驟〉的來源）。</p>
