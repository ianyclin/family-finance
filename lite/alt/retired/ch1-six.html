<h3>六個最貴的錯</h3>
<ol class="checklist">
<li><strong>借錢投資。</strong>利息一定要付，報酬不一定有（第六章）。</li>
<li><strong>五年內要用的錢放股票。</strong>先把這筆錢分出去（第二、四章）。</li>
<li><strong>被詐騙。</strong>遇到四個立即停止的任何一個，就停（第五章）。</li>
<li><strong>大跌時恐慌賣。</strong>跌了做什麼，在平靜的時候先寫好（第四、八章）。</li>
<li><strong>買到高費用產品。</strong>追蹤同一類指數的，先比總費用（第六章）。</li>
<li><strong>照抄別人的配置。</strong>股債比用自己的金額和用錢日期去算（第四、九章）。</li>
</ol>
