<p><strong>冷卻期怎麼分：</strong></p>
<ul class="checklist">
<li><strong>規則：</strong>計畫表上任何一格要改（想賣、想加碼、換商品、調高股票比例都算），都先寫下日期和理由，等冷卻期過了才生效。</li>
<li><strong>例外：</strong>人生狀況變了（用錢的期限變短、收入變了、家庭狀況變了），或比例太高、已經影響睡眠，要把股票比例長期調低，可以馬上做；一樣要寫下日期和理由。</li>
<li><strong>怎麼分辨：</strong>打算等市場穩了再買回來的，是因為短期漲跌想賣，要等冷卻期；願意把計畫表上的比例改低，以後不因為市場漲回來又升回去，才算長期降低風險。</li>
</ul>
