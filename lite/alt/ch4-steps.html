<div class="data-card"><h3>股票放幾成：地板、壓力測試、三問</h3><ol class="checklist"><li><strong>地板：</strong>五年內要用的錢不放股票，先分出去。</li><li><strong>壓力測試：</strong>剩下長期的錢，用下面的表算出「股票大跌那天，帳面實際少幾萬」。</li><li><strong>三問：</strong>答得過的股票比例，才寫進計畫表 E 區。</li></ol><p>例如有 100 萬，其中 30 萬五年內要買車，這 30 萬先不放股票；剩下 70 萬如果放股票八成、定存兩成，股票跌一半那天少 28 萬。看到少 28 萬還照得了計畫，這個比例才留下。</p><p class="small">粗篩：把能忍的跌幅乘 2，大約是股票比例的上限。它只能刪掉明顯太高的比例，不能定案。</p></div>
