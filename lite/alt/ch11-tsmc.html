<h3>朋友集中一檔賺很多：他也幫你打工</h3><p>眼前看到的是短暫片段，不是完整二十年。假設他重押的是台積電：2026 年 8 月底，全球指數 MSCI ACWI 裡台積電占 1.80%，你每投 1 萬元，大約 180 元本來就在它身上。他賺錢的那家公司，也有一小塊在幫你打工；只是你同時請了兩千多家公司一起打工，不用猜明年哪一家最好。</p><p class="small">權重每個月都會變。這不是說集中一定比較差，是說它輸的時候，你不會跟著輸那麼多。</p>
