<h3>前幾年像沒在長：先有心理準備</h3><p>剛開始的幾年，帳戶裡幾乎都是自己存進去的錢。每年底投 6 萬、一年長 7%（樂觀的樣子），第一個 60 萬要 7.84 年，裡面只有 22% 是賺來的；照低情境算，賺來的占比更少。所以前幾年打開帳戶，看起來像沒在長。這是正常的，不是方法失效。</p><p>這段時間最容易想換一個「比較快」的做法。前幾年要看的是有沒有照規則投入，不是帳戶長了多少。</p>
