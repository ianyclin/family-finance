<p><span class="label-practice">本指南的做法</span>核心放全球市值型，台股大盤可以是裡面的一塊。放多少沒有標準答案：股票裡台股大盤另外多放 0、一成、兩成，都有人這樣做；全球市值型裡本來就有台灣約 3%。<span class="small">這是舉例，不是建議值。</span>多放本國的代價，是薪水、房子、投資押在同一個地方。</p>
<p>台灣最大五十家公司的 ETF 這類，最大的一家就占了五到六成：分散得到其他公司，分散不掉最大那一家。台股大盤可以是股票裡的一塊，不能是全部。</p>
