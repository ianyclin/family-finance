<div class="data-card"><h3>台灣常見的兩個坑</h3><ul class="checklist"><li><strong>借錢買高股息 ETF，想用配息付利息。</strong>借的錢利息一定要付，配息卻會讓淨值變少。臺灣銀行信貸的真實年成本 6.69%，比低、中情境的 4%、6% 都高。拿股票去借錢（質押），股價大跌時會被要求補錢，沒補就可能被賣在低點；向券商借錢買股票（融資）也一樣，股票市值跌到只剩借款的 1.3 倍，就要補錢。</li><li><strong>月配息基金。</strong>配息高不等於賺得多：配息可能來自本金，那一塊是把你自己的錢還給你，不是賺來的。比的時候看總費用和含息總報酬，不看配息率。</li></ul></div>
