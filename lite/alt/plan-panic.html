<div class="data-card"><h3>跌的那一天先看這裡</h3><p><strong>已經寫好計畫的人：</strong>把那張紙拿出來，照「市場下跌時」那一行做。今天不重新想一次。</p><p><strong>還沒寫過的人：</strong>今天不是寫規則的日子。今天只做三件事：不賣、不加碼、關掉 app 的漲跌推播。</p><p>再確認一件事：這筆錢五年內用不用得到。用得到，先看第 <a class="xref" href="#s5-remember">5</a> 節「跌的時候、很久沒漲的時候，記得這幾句」。</p><p>挑一個平靜的日子回來，填上面的六行。</p></div>
