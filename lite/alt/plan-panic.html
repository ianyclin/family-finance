<div class="data-card"><h3>跌的那一天先看這裡</h3><p>這張卡給照本指南做長期、分散投資的人。先確認兩件事：這筆錢五年內用不用得到；是不是借錢買的。任何一個答「是」，今天不適用這張卡。</p><p class="small">手上是以前買的個股也不適用。這三種情況回完整版看：五年內要用的，「跌的時候、很久沒漲的時候，記得這幾句」；借錢買的，「年輕時借錢投資，有沒有道理？」；個股，「處理套牢的舊部位」。</p><p><strong>已經寫好計畫的人：</strong>把那張紙拿出來，照「市場下跌時」那一行做。今天不重新想一次。</p><p><strong>還沒寫過的人：</strong>今天不是寫規則的日子。今天只做三件事：不賣、不加碼、關掉 app 的漲跌推播。</p><p>挑一個平靜的日子回來，填上面的六行。</p></div>
