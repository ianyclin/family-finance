<ol class="checklist"><li><strong>開戶。</strong>到合法券商開證券戶，同時綁一個銀行帳戶當交割戶（買股票從這裡扣錢、賣股票錢匯進這裡）。只找主管機關（金管會）查得到的合法業者。台灣掛牌的 ETF 用券商 app 的定期定額或零股功能就買得到，不必湊滿一張。</li><li><strong>下單前核對。</strong>商品全名、代號、交易所、幣別、買賣方向、數量與價格。定期定額由券商代你下單；自己下單時，限價單是「最多用這個價買」，寫太低會買不到。零股交易只收限價單。</li></ol>
