<p><strong>為什麼買整個市場，不自己挑。</strong>有人挑對，就有人挑錯，加起來就是市場平均；挑的人還要多付費用，扣完以後整體一定低於平均。美國大型股的主動基金放 20 年，有 92.89% 輸給大盤。費用是確定的：每月 5,000 元投 30 年，用全部放股票時的中情境和被費用吃掉一個百分點以後比，最後差約 86 萬。</p>
