<h3>新手先記住這七件事</h3>
<ol class="checklist">
<li>買低成本、分散、按市值比重的指數 ETF，核心放全球型。</li>
<li>固定時間買，不猜高低點。</li>
<li>扣掉五年內要用的錢，能存多少就投多少。</li>
<li>定好股債比；投資圈跌 10%、20%、30% 以上各做什麼，先寫進計畫表。</li>
<li>長期持有；五年內要用的錢不放股票。</li>
<li>少花時間看盤，把時間留給家庭和增加收入。</li>
<li>甜蜜點（資產一年長出來的錢，追上你一年投入的錢）大約要 10 到 18 年才到，不要為了早點到而多放股票。</li>
</ol>
